                          <div style="display:flex; align-items:center; gap:8px;">
                            <span id="sa-pwd-text-${idx}" data-real="${s.password}" data-shown="false" style="font-family:monospace; font-weight:700; color:#475569; background:#f1f5f9; padding:4px 8px; border-radius:6px; border:1px solid #e2e8f0;">••••••••</span>
                            <button type="button" id="sa-pwd-btn-${idx}" onclick="toggleSchoolPwdRow(${idx})" style="background:none; border:none; cursor:pointer; font-size:14px;" title="Lihat/Sembunyikan Password">👁️</button>
                          </div>
                        </td>
                        <td style="padding:12px 12px; font-weight:700; color:#334155;">
                          ${s.kepsek || '-'}
                        </td>
                        <td style="padding:12px 12px; text-align:center;">
                          <div style="display:inline-flex; gap:6px;">
                            <button type="button" onclick='superAdminEnterSchool("${s.npsn}", "${s.nama.replace(/"/g, '&quot;')}")' class="btn-xs btn-download" style="background:#059669; padding:6px 10px; font-size:11px;" title="Masuk ke portal sekolah ini">
                              🚀 Masuk Portal
                            </button>
                            <button type="button" onclick='openSuperAdminSchoolModal(${JSON.stringify(s).replace(/'/g, "&apos;")})' class="btn-xs btn-view" style="background:#0284c7; padding:6px 10px; font-size:11px;" title="Ubah data sekolah">
                              ✏️ Ubah
                            </button>
                            <button type="button" onclick='deleteSuperAdminSchool("${s.npsn}", "${s.nama.replace(/"/g, '&quot;')}")' class="btn-xs btn-delete" style="background:#ef4444; padding:6px 10px; font-size:11px;" title="Hapus sekolah">
                              🗑️ Hapus
                            </button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderSuperAdminSchoolModal() {
      const s = state.superAdminSchoolModalData;
      const isEdit = !!s;
      return `
        <div class="modal-overlay no-print" style="z-index: 100001;" onclick="closeSuperAdminSchoolModal()">
          <div class="modal-content" style="max-width: 520px; height: auto; border-radius: 20px; background: #ffffff; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden;" onclick="event.stopPropagation()">
            <div class="modal-header" style="background: #0f172a; padding: 16px 20px; border-bottom: 2px solid #f59e0b; display:flex; justify-content:space-between; align-items:center;">
              <h3 style="margin:0; font-size:15px; font-weight:900; color:#ffffff;">
                ${isEdit ? '✏️ Ubah Data Sekolah' : '➕ Tambah Sekolah Baru'}
              </h3>
              <button type="button" onclick="closeSuperAdminSchoolModal()" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer; line-height:1;">&times;</button>
            </div>
            <div style="padding: 24px; background: #ffffff;">
              <form onsubmit="submitSuperAdminSchoolForm(event)">
                <input type="hidden" id="sa-form-old-npsn" value="${isEdit ? s.npsn : ''}" />

                <div class="form-group" style="margin-bottom: 14px;">
                  <label class="form-label">Nama Sekolah:</label>
                  <input type="text" id="sa-form-nama" class="form-input" required placeholder="Contoh: SDIT ANNISA" value="${isEdit ? (s.nama || '') : ''}" />
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                  <label class="form-label">Username (NPSN):</label>
                  <input type="text" id="sa-form-npsn" class="form-input" required placeholder="Contoh: 20231556" value="${isEdit ? (s.npsn || '') : ''}" />
                  <p style="font-size:10.5px; color:#64748b; margin-top:3px;">* NPSN unik berfungsi sebagai username login sekolah.</p>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                  <label class="form-label">Nama Kepala Sekolah:</label>
                  <input type="text" id="sa-form-kepsek" class="form-input" required placeholder="Contoh: Abdul Yakub, S.Ag" value="${isEdit ? (s.kepsek || '') : ''}" />
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                  <label class="form-label">Password Login Sekolah & Portal:</label>
                  <input type="text" id="sa-form-password" class="form-input" required placeholder="Masukkan kata sandi" value="${isEdit ? (s.password || '') : ''}" />
                </div>

                <div style="display:flex; gap:10px;">
                  <button type="button" onclick="closeSuperAdminSchoolModal()" class="btn-primary" style="flex:1; background:#64748b; padding:12px;">Batal</button>
                  <button type="submit" class="btn-primary" style="flex:2; background:#059669; padding:12px;">💾 Simpan Data Sekolah</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
